<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="1" stop-color="#13101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#8f7dff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="42" fill="#0d0d15"/>
  <circle cx="26" cy="21" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="21" r="7" fill="#febc2e"/>
  <circle cx="74" cy="21" r="7" fill="#28c840"/>
  <text x="600" y="27" text-anchor="middle" fill="#555" font-family="monospace" font-size="15" font-weight="bold">postfix — /etc/postfix/main.cf</text>
  <text x="60" y="110" fill="#6c5ce7" font-family="monospace" font-size="24" font-weight="bold">✉ SMTP MAIL SERVER</text>
  <text x="60" y="145" fill="#8a8a9a" font-family="monospace" font-size="18">custom domain · SPF + DKIM + DMARC · 100% inbox</text>
  <rect x="60" y="185" width="1080" height="300" rx="12" fill="#0d0d15" stroke="#23233a"/>
  <text x="90" y="225" fill="#8a8a9a" font-family="monospace" font-size="18">$ sudo postmap /etc/postfix/sasl_passwd</text>
  <text x="90" y="265" fill="#8a8a9a" font-family="monospace" font-size="18">$ dig TXT vincentiwuno.me +short</text>
  <text x="90" y="305" fill="#9adca3" font-family="monospace" font-size="18">"v=spf1 include:spf.brevo.com ~all"</text>
  <text x="90" y="350" fill="#6c5ce7" font-family="monospace" font-size="18">$ opendkim-testkey -d vincentiwuno.me -s default</text>
  <text x="90" y="390" fill="#9adca3" font-family="monospace" font-size="18">key OK</text>
  <rect x="60" y="510" width="1080" height="100" rx="12" fill="#0f1a14" stroke="#1e3a2a"/>
  <text x="90" y="552" fill="#3ddc84" font-family="monospace" font-size="20" font-weight="bold">✓ SPF pass · DKIM pass · DMARC pass</text>
  <text x="90" y="588" fill="#5a5a6a" font-family="monospace" font-size="16">0 / 20 test emails hit spam · Gmail · Outlook · ProtonMail</text>
